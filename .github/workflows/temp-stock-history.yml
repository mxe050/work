name: Temporary Japanese stock history export

on:
  push:
    branches:
      - temp/stock-history-20260817
    paths:
      - ".github/workflows/temp-stock-history.yml"
      - "stock_job/**"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4

      - name: Fetch and summarize daily OHLC
        run: python3 stock_job/fetch_stock_history.py

      - name: Upload stock summary
        uses: actions/upload-artifact@v4
        with:
          name: stock-summary-20260814
          path: stock_job/output/
          if-no-files-found: error
          retention-days: 1
