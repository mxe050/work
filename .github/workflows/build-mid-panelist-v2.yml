name: Build MID panelist survey tutorial v2

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-mid-panelist-v2.yml"
      - "mid_panelist_v2/**"

permissions:
  contents: read

concurrency:
  group: build-mid-panelist-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          ok=0
          for attempt in 1 2 3; do
            if timeout 600s sudo apt-get update -o Acquire::Retries=5 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60; then ok=1; break; fi
            sleep 10
          done
          test "$ok" -eq 1
          timeout 600s sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends fonts-noto-cjk ffmpeg
          python -m pip install --disable-pip-version-check playwright pillow qrcode requests
          BROWSER_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$BROWSER_BIN" ]; then
            echo "BROWSER_EXECUTABLE=$BROWSER_BIN" >> "$GITHUB_ENV"
          else
            timeout 360s python -m playwright install --with-deps chromium
          fi

      - name: Decode, patch, and verify production scripts
        run: |
          cat mid_panelist_v2/payload/build_panelist_video_v2.py.gz.b64.part_* | tr -d '\r\n\t ' | base64 --decode | gzip -dc > mid_panelist_v2/build_panelist_video_v2.py
          cat mid_panelist_v2/payload/panelist_script_v2.py.gz.b64.part_* | tr -d '\r\n\t ' | base64 --decode | gzip -dc > mid_panelist_v2/panelist_script_v2.py
          echo "7a8523b7d24b7a3ef2f64b580164054dbb0b73d644ec177c1e4f0030988de6c6  mid_panelist_v2/build_panelist_video_v2.py" | sha256sum --check
          echo "a30f80a945c1d05faf338909f9d380e5e4ff8032dd54b0c3c316fc208a199ad7  mid_panelist_v2/panelist_script_v2.py" | sha256sum --check
          python - <<'PY'
          from pathlib import Path
          p = Path("mid_panelist_v2/build_panelist_video_v2.py")
          s = p.read_text(encoding="utf-8")
          old = '''def concat_video(clips: list[Path], concat_file: Path, out: Path) -> None:\n    concat_file.write_text("\\n".join([f"file '{p.as_posix()}'" for p in clips])+"\\n",encoding="utf-8")\n    run(["ffmpeg","-y","-f","concat","-safe","0","-i",str(concat_file),"-c","copy",str(out)])\n'''
          new = '''def concat_video(clips: list[Path], concat_file: Path, out: Path) -> None:\n    # ffmpeg resolves entries relative to the ffconcat file. Absolute paths avoid duplicating a relative --work prefix.\n    lines = []\n    for clip in clips:\n        resolved = clip.resolve().as_posix().replace("'", "'\\\\''")\n        lines.append(f"file '{resolved}'")\n    concat_file.write_text("\\n".join(lines)+"\\n", encoding="utf-8")\n    run(["ffmpeg","-y","-f","concat","-safe","0","-i",str(concat_file),"-c","copy",str(out)])\n'''
          if old not in s:
              raise SystemExit("concat_video patch target not found")
          s = s.replace(old, new).replace('"-preset","medium","-crf","18"', '"-preset","fast","-crf","18"')
          p.write_text(s, encoding="utf-8")
          PY
          echo "522b46d181a278efec82c67c678f7594b2a55dc45706f5e925ead5c9c5071fba  mid_panelist_v2/build_panelist_video_v2.py" | sha256sum --check
          python -m py_compile mid_panelist_v2/capture_sources_v2.py mid_panelist_v2/build_panelist_video_v2.py mid_panelist_v2/panelist_script_v2.py

      - name: Capture current source pages and all form pages
        run: |
          mkdir -p output/captures_v2 output/work_v2 output/final_v2
          python mid_panelist_v2/capture_sources_v2.py --output output/captures_v2
          cat output/captures_v2/capture_report_v2.json

      - name: Start official VOICEVOX Engine
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --name voicevox-engine -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest

      - name: Build panelist-facing tutorial
        env:
          VOICEVOX_URL: http://127.0.0.1:50021
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python mid_panelist_v2/build_panelist_video_v2.py \
            --assets output/captures_v2 \
            --script mid_panelist_v2/panelist_script_v2.py \
            --work output/work_v2 \
            --output output/final_v2 \
            --voicevox-url "$VOICEVOX_URL" \
            --speed 1.17 2>&1 | tee output/final_v2/build_console.log

      - name: Validate deliverables
        run: |
          test -s output/final_v2/MID_panelist_survey_tutorial_Guyatt_VOICEVOX_v2.mp4
          test -s output/final_v2/MID_panelist_survey_tutorial_v2_complete_package.zip
          test -s output/final_v2/MID_panelist_survey_v2_subtitles.srt
          test -s output/final_v2/MID_panelist_survey_v2_dialogue_script.txt
          grep -q "STATUS: PASS" output/final_v2/QA_REPORT_v2.txt
          cat output/final_v2/QA_REPORT_v2.txt
          ffprobe -v error -show_entries format=duration,size:stream=index,codec_type,codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 output/final_v2/MID_panelist_survey_tutorial_Guyatt_VOICEVOX_v2.mp4
          unzip -t output/final_v2/MID_panelist_survey_tutorial_v2_complete_package.zip

      - name: Preserve diagnostics
        if: always()
        run: |
          mkdir -p output/final_v2
          tail -n 500 output/final_v2/build_console.log 2>/dev/null || true
          find output/work_v2 output/final_v2 -maxdepth 3 -type f -printf '%p\t%k KB\n' 2>/dev/null | sort | tee output/final_v2/work_file_manifest.txt || true
          df -h | tee output/final_v2/disk_report.txt || true
          free -h | tee output/final_v2/memory_report.txt || true
          docker logs --tail 200 voicevox-engine 2>&1 | tee output/final_v2/voicevox_engine_tail.log || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mid-panelist-v2-build-diagnostics-${{ github.run_id }}
          path: |
            output/final_v2/*.log
            output/final_v2/*report.txt
            output/final_v2/work_file_manifest.txt
            output/work_v2/*.json
            output/captures_v2/capture_report_v2.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload completed tutorial
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mid-panelist-survey-tutorial-v2-voicevox
          path: output/final_v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Stop VOICEVOX Engine
        if: always()
        run: docker rm -f voicevox-engine 2>/dev/null || true
